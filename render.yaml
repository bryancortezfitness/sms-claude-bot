# One-click deploy config for Render (render.com).
# Render reads this automatically when you create a Blueprint from the repo.
services:
  - type: web
    name: sms-claude-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: SEND_SECRET
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
